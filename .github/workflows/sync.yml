name: Sync Fork

on:
  schedule:
    # Runs every 48 hours (at 00:00 every 2 days)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows you to trigger the sync manually whenever you want

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes
        run: |
          # Fetch the latest branches from the original repository
          gh repo sync ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
